[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awsgetsts"
version = "0.1.0"
description = "Issue AWS STS session tokens (MFA/TOTP) and merge them into ~/.aws/config"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "louky0714", email = "louky0714@gmail.com" },
]
keywords = ["aws", "sts", "mfa", "totp", "cli", "credentials"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = [
    "boto3>=1.43,<2",
    "pyotp>=2.9,<3",
    "python-dateutil>=2.9,<3",
    "cplogger>=0.1,<1",
    "termcolor>=2,<4",
]

[project.scripts]
awsgetsts = "awsgetsts.cli:main"

[project.urls]
Homepage = "https://github.com/HonamSong/aws-getsts"
Repository = "https://github.com/HonamSong/aws-getsts"
Issues = "https://github.com/HonamSong/aws-getsts/issues"

[tool.setuptools.packages.find]
include = ["awsgetsts*"]
exclude = ["tests*"]